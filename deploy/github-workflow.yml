# 3F Club - build and deploy to Azure App Service
#
# This file lives in deploy/ deliberately. Move it to .github/workflows/deploy.yml
# ONLY once the Azure resources exist and the repository secrets below are set --
# otherwise it runs on every push and fails.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   AZURE_CLIENT_ID        app registration used for OIDC federated credentials
#   AZURE_TENANT_ID
#   AZURE_SUBSCRIPTION_ID
#
# OIDC is used instead of a downloaded publish profile so there is no long-lived
# credential sitting in the repository.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: app-3fclub
  NODE_VERSION: '22.x'

# Required for the OIDC token exchange.
permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test -- --run

      - name: Build
        run: npm run build
        env:
          # Next.js needs a database URL present at build time for route analysis.
          # This is a throwaway value; nothing connects during the build.
          DATABASE_URL: postgresql://build:build@localhost:5432/build
          NEXT_TELEMETRY_DISABLED: '1'

      # next.config.mjs must set `output: 'standalone'`. The standalone folder
      # contains server.js plus a pruned node_modules -- everything App Service
      # needs and nothing it does not.
      - name: Assemble standalone bundle
        run: |
          cp -r .next/static .next/standalone/.next/static
          if [ -d public ]; then cp -r public .next/standalone/public; fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: .next/standalone
          retention-days: 5

  deploy:
    name: Deploy to App Service
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production
      url: ${{ steps.deploy.outputs.webapp-url }}
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: app
          path: app

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Run database migrations
        run: |
          echo "Add your Drizzle migration step here, for example:"
          echo "  npx drizzle-kit migrate"
        # Migrations run before the new code goes live, so keep them additive:
        # add columns before you use them, drop them a release later.

      - name: Deploy
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: app

      - name: Smoke test
        run: |
          sleep 20
          code=$(curl -s -o /dev/null -w '%{http_code}' "${{ steps.deploy.outputs.webapp-url }}/api/health")
          echo "Health check returned $code"
          test "$code" = "200"
